<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Launch animation</title>
</head>

<body style="text-align:center; font-family:sans-serif; margin-top:80px;">

<h2>Yeast animation launcher</h2>

<button id="btn" style="font-size:18px; padding:10px 20px;">
  Open animation
</button>

<script>
const url = "https://wbakker10.github.io/BRP-2026-animations/population_animation.html";

document.getElementById("btn").onclick = () => {

  const width = 1100;
  const height = 750;

  const left = (screen.width - width) / 2;
  const top = (screen.height - height) / 2;

  const w = window.open(
    url,
    "animation",
    `width=${width},height=${height},left=${left},top=${top}`
  );

  if (w) {
    w.focus();
  } else {
    alert("Popup blocked. Please allow popups for this site.");
  }
};
</script>

</body>
</html>
